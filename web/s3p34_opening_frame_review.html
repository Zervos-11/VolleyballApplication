<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S3 P34 opening frames</title>
<style>
body{font:16px system-ui;background:#111923;color:#f3f7fa;margin:0;padding:10px}header{display:flex;gap:9px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#111923;z-index:3;padding:5px 0}button,select{font:inherit;padding:7px}button{cursor:pointer}main{display:grid;grid-template-columns:minmax(400px,1.4fr) minmax(440px,1fr);gap:12px}.picture{position:relative;align-self:start;width:fit-content;max-width:100%}.picture img{display:block;width:auto;height:auto;max-width:100%;max-height:68vh}.picture canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{border:1px solid #61798c;border-radius:5px;padding:7px;background:#202e39}.card strong{display:block;margin-bottom:5px}.field{display:flex;justify-content:space-between;gap:6px;align-items:center;margin:3px 0}.field select{width:58%}#message{color:#b3ecbd}#save{background:#c5e9fb}@media(max-width:980px){main{grid-template-columns:1fr}.picture img{max-height:50vh}}
</style></head><body>
<header><button id="prev">Previous</button><strong id="heading"></strong><button id="next">Next</button><button id="toggle">Hide suggested boxes</button><span id="progress"></span><button id="export">Export when complete</button></header>
<main><div class="picture"><img id="image" alt="Unboxed source frame"><canvas id="overlay"></canvas></div><section><p>Check the six near-side players. White numbered boxes are provisional matches to frame 36001. Change any incorrect identity, box or ground state.</p><div id="cards" class="cards"></div><p><label><input id="checked" type="checkbox"> I checked all six players in this source frame</label></p><button id="save">Save and next</button><p id="message"></p></section></main>
<script>
let data,index=0,showBoxes=true;const $=id=>document.getElementById(id);const slots=['28','12','15','7','19','21'];
async function req(url,method='GET',body){const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j}
function row(){return data.manifest.rows[index]}
function select(options,value){const s=document.createElement('select');for(const [v,label] of options){const o=document.createElement('option');o.value=v;o.textContent=label;s.append(o)}s.value=value;return s}
function field(card,label,options,value,key){const div=document.createElement('div');div.className='field';div.append(document.createTextNode(label));const s=select(options,value);s.dataset.key=key;div.append(s);card.append(div);return s}
function draw(){const r=row(),saved=data.draft.frames[String(r.frame)];$('heading').textContent=`Frame ${r.frame} (${index+1}/3)`;$('image').src=`/api/image/${r.frame}`;$('progress').textContent=`${Object.keys(data.draft.frames).length}/3 saved`;$('checked').checked=false;$('cards').replaceChildren();for(let i=0;i<slots.length;i++){const slot=slots[i],p=saved?.[slot]||{},has=!!r.suggested_boxes[slot],card=document.createElement('div');card.className='card';card.dataset.slot=slot;card.innerHTML=`<strong>Player ${i+1} · UCLA #${slot} ${has?'· box proposed':'· no box'}</strong>`;field(card,'Identity',[['same_by_sequence','Same by sequence'],['digit_confirmed','Digit confirmed'],['uncertain','Uncertain'],['wrong','Wrong player']],p.identity||'same_by_sequence','identity');const ground=field(card,'Ground',[['grounded','Grounded'],['airborne','Airborne'],['uncertain','Uncertain']],p.ground||'grounded','ground');const box=field(card,'Box',[['same','Same player'],['missing','Missing'],['wrong','Wrong player']],p.box||(has?'same':'missing'),'box');const floor=field(card,'Floor proxy',[['plausible','Plausible'],['not_applicable','Not applicable'],['uncertain','Uncertain']],p.floor||(has?'plausible':'not_applicable'),'floor');ground.onchange=()=>{if(ground.value!=='grounded')floor.value='not_applicable'};box.onchange=()=>{if(box.value!=='same')floor.value='not_applicable'};$('cards').append(card)}$('save').disabled=data.completed;$('export').disabled=data.completed;$('message').textContent=data.completed?'Export frozen':saved?'Saved; you may revise before export':'';paint()}
function paint(){const img=$('image'),canvas=$('overlay');if(!img.naturalWidth)return;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!showBoxes)return;for(let i=0;i<slots.length;i++){const slot=slots[i],b=row().suggested_boxes[slot];if(!b)continue;ctx.strokeStyle='white';ctx.lineWidth=3;ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);ctx.font='bold 22px system-ui';const label=`${i+1} / #${slot}`,w=ctx.measureText(label).width+12;ctx.fillStyle='black';ctx.fillRect(b[0],Math.max(0,b[1]-27),w,27);ctx.fillStyle='yellow';ctx.fillText(label,b[0]+6,Math.max(21,b[1]-6))}}
$('image').onload=paint;$('prev').onclick=()=>{index=Math.max(0,index-1);draw()};$('next').onclick=()=>{index=Math.min(2,index+1);draw()};$('toggle').onclick=()=>{showBoxes=!showBoxes;$('toggle').textContent=showBoxes?'Hide suggested boxes':'Show suggested boxes';paint()};
$('save').onclick=async()=>{if(!$('checked').checked){$('message').textContent='Check the all-six box first';return}const players={};for(const card of $('cards').children){const p={};for(const s of card.querySelectorAll('select'))p[s.dataset.key]=s.value;players[card.dataset.slot]=p}try{const n=row().frame,r=await req(`/api/review/${n}`,'PUT',{expected_revision:data.draft.revision,checked_all_six:true,players});data.draft=r.draft;const next=data.manifest.rows.findIndex((x,i)=>i>index&&!data.draft.frames[String(x.frame)]);if(next>=0)index=next;else if(index<2)index++;draw()}catch(e){$('message').textContent=`Save failed: ${e.message}`}};
$('export').onclick=async()=>{try{await req('/api/export','POST');data.completed=true;draw();$('message').textContent='Export saved.'}catch(e){$('message').textContent=`Export failed: ${e.message}`}};
(async()=>{try{data=await req('/api/review');index=data.manifest.rows.findIndex(r=>!data.draft.frames[String(r.frame)]);if(index<0)index=0;draw()}catch(e){$('message').textContent=e.message}})();
</script></body></html>
