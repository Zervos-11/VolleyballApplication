<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S3 P34 event review</title>
<style>
body{font:17px system-ui;background:#111923;color:#f4f8fc;margin:0;padding:12px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#111923;padding:5px 0;z-index:2}button{font:inherit;padding:9px 14px;cursor:pointer}button.selected{background:#b9e8ff;border:3px solid #fff}#frame{max-width:100%;max-height:72vh;object-fit:contain;border:1px solid #5b7081}main{display:grid;grid-template-columns:minmax(400px,1fr) 280px;gap:12px}#choices{display:grid;gap:9px;align-content:start}#choices button{text-align:left}#note{font:inherit;width:95%;height:70px}#message{color:#a9eab9}#progress{font-weight:bold}@media(max-width:850px){main{grid-template-columns:1fr}#frame{max-height:58vh}}
</style></head><body>
<header><button id="prev">Previous</button><strong id="heading"></strong><button id="next">Next</button><span id="progress"></span><button id="export">Export when complete</button></header>
<main><img id="frame" alt="Unboxed source frame"><section><p id="prompt"></p><div id="choices"></div><p>Optional note</p><textarea id="note"></textarea><p><button id="save">Save and next</button></p><p id="message"></p></section></main>
<script>
let data,index=0,choice=null;const $=id=>document.getElementById(id);
async function request(url,method='GET',body){const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j}
function frame(){return data.manifest.frames[index]}
function draw(){const f=frame(),saved=data.draft.verdicts[String(f.frame)];choice=saved?.status||null;$('heading').textContent=`${f.event==='serve'?'Serve contact':'Point ending'} · frame ${f.frame} (${index+1}/28)`;$('frame').src=`/api/image/${f.frame}`;$('prompt').textContent=f.event==='serve'?'Judge the ball relative to the serving hand in this frame. Use Uncertain if contact cannot be seen.':'Is the ball still live or definitely dead in this frame? Use Uncertain if unclear.';const opts=f.event==='serve'?[['before_contact','Before contact'],['contact_visible','Contact visible'],['after_contact','After contact'],['uncertain','Uncertain']]:[['live','Live'],['dead','Definitely dead'],['uncertain','Uncertain']];$('choices').replaceChildren(...opts.map(([value,label])=>{const b=document.createElement('button');b.textContent=label;b.className=value===choice?'selected':'';b.onclick=()=>{choice=value;drawChoices(opts)};b.dataset.value=value;return b}));$('note').value=saved?.note||'';$('progress').textContent=`${Object.keys(data.draft.verdicts).length}/28 saved`;$('save').disabled=data.completed;$('export').disabled=data.completed;$('message').textContent=data.completed?'Export frozen':saved?'Saved; you may revise before export':''}
function drawChoices(opts){for(const b of $('choices').children)b.className=b.dataset.value===choice?'selected':''}
$('prev').onclick=()=>{index=Math.max(0,index-1);draw()};$('next').onclick=()=>{index=Math.min(27,index+1);draw()};
$('save').onclick=async()=>{if(!choice){$('message').textContent='Choose one status first';return}try{const f=frame();const r=await request(`/api/review/${f.frame}`,'PUT',{expected_revision:data.draft.revision,status:choice,note:$('note').value});data.draft=r.draft;const next=data.manifest.frames.findIndex((x,i)=>i>index&&!data.draft.verdicts[String(x.frame)]);if(next>=0)index=next;else if(index<27)index++;draw()}catch(e){$('message').textContent=`Save failed: ${e.message}`}};
$('export').onclick=async()=>{try{const r=await request('/api/export','POST');data.completed=true;draw();$('message').textContent=`Export saved. Serve contact: ${r.summary.serve_contact_visible_frames.join(', ')||'unresolved'}; last live ${r.summary.last_reviewed_live??'unknown'}; first dead ${r.summary.first_reviewed_dead??'unknown'}.`}catch(e){$('message').textContent=`Export failed: ${e.message}`}};
(async()=>{try{data=await request('/api/review');index=data.manifest.frames.findIndex(f=>!data.draft.verdicts[String(f.frame)]);if(index<0)index=0;draw()}catch(e){$('message').textContent=e.message}})();
</script></body></html>
